<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coda · Composition coach</title>
<style>
  :root { --ink:#011627; --ink-2:#0b2540; --line:#1b3d5f; --fuchsia:#ff3366; --sea:#2ec4b6; --snow:#f6f7f8; --blue:#20a4f3; --muted:#a7b4c4; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; background:var(--ink); color:var(--snow); font:16px/1.6 system-ui, sans-serif; }
  .app { max-width: 820px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; padding: 0 16px; }
  header { display:flex; flex-wrap: wrap; align-items:center; justify-content: space-between; gap: .75rem; padding: 1.25rem 0 .9rem; border-bottom: 2px solid var(--fuchsia); }
  h1 { font-size: 1.6rem; margin: 0; line-height: 1.2; } h1 span { color: var(--fuchsia); }
  .lead { margin: .15rem 0 0; color: var(--muted); font-size: .9rem; }
  .controls { display:flex; gap:.5rem; align-items:center; }
  select, button { font: inherit; color: var(--snow); background: var(--ink-2); border: 1px solid var(--line); border-radius: 10px; padding: .45rem .7rem; }
  select:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  button { cursor: pointer; } button:hover { border-color: var(--sea); }
  #log { flex: 1; overflow-y: auto; padding: 1.25rem 0; display: flex; flex-direction: column; gap: 1rem; }
  .msg { max-width: 88%; padding: .7rem 1rem; border-radius: 14px; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--fuchsia); color: var(--ink); font-weight: 500; border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .msg.bot { align-self: flex-start; background: var(--ink-2); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.bot > :first-child { margin-top: 0; } .msg.bot > :last-child { margin-bottom: 0; }
  .msg.bot h1, .msg.bot h2, .msg.bot h3 { font-size: 1.02rem; color: var(--sea); margin: 1rem 0 .3rem; }
  .msg.bot a { color: var(--blue); }
  .msg.bot code { background: var(--ink); padding: .1rem .35rem; border-radius: 5px; font-size: .9em; }
  .msg.bot pre { background: var(--ink); padding: .7rem; border-radius: 8px; overflow-x: auto; } .msg.bot pre code { padding: 0; }
  .msg.bot table { border-collapse: collapse; display: block; overflow-x: auto; font-size: .92rem; }
  .msg.bot th, .msg.bot td { padding: .3rem .55rem; border-bottom: 1px solid var(--line); text-align: left; } .msg.bot th { color: var(--sea); }
  .msg.notice { align-self: flex-start; border: 1px dashed var(--sea); color: var(--muted); background: transparent; }
  .msg.error { align-self: center; border: 1px solid var(--fuchsia); color: var(--fuchsia); background: transparent; font-size: .92rem; }
  .meta { display: block; margin-top: .4rem; font-size: .75rem; color: var(--muted); }
  .typing span { display:inline-block; width:.5rem; height:.5rem; margin-right:.25rem; border-radius:50%; background: var(--sea); animation: b 1s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes b { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
  .empty { margin: auto; text-align: center; color: var(--muted); }
  .chips { display:flex; flex-wrap: wrap; gap: .5rem; justify-content: center; margin-top: 1rem; }
  .chips button { border-radius: 999px; font-size: .88rem; color: var(--sea); }
  form { display:flex; gap:.5rem; padding: .75rem 0 1.25rem; border-top: 1px solid var(--line); }
  textarea { flex: 1; resize: none; font: inherit; color: var(--snow); background: var(--ink-2); border: 1px solid var(--line); border-radius: 12px; padding: .65rem .85rem; min-height: 48px; max-height: 180px; }
  textarea::placeholder { color: var(--muted); }
  #send { background: var(--fuchsia); color: var(--ink); font-weight: 700; border: 0; padding: 0 1.2rem; }
  #send:disabled { opacity: .5; cursor: default; }
  @media (prefers-reduced-motion: reduce) { .typing span { animation: none; opacity: .7; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Coda <span>·</span> composition coach</h1>
      <p class="lead">Ask about harmony, melody, form, arrangement or songwriting.</p>
    </div>
    <div class="controls">
      <select id="model" aria-label="Model"></select>
      <button id="reset" type="button" title="Start a new conversation">New chat</button>
    </div>
  </header>

  <div id="log" aria-live="polite">
    <div class="empty" id="empty">
      <p>Hi, I'm Coda. What are you writing?</p>
      <div class="chips">
        <button type="button">Give me a moody chord progression in D minor</button>
        <button type="button">How do I modulate from C to G?</button>
        <button type="button">My chorus feels flat. How do I lift it?</button>
      </div>
    </div>
  </div>

  <form id="form">
    <textarea id="input" rows="1" placeholder="Message Coda… (Enter to send, Shift+Enter for a new line)" required></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</div>

<script type="module">
  import { marked } from '/marked.js';

  const $ = (id) => document.getElementById(id);
  const log = $('log'), input = $('input'), send = $('send'), model = $('model');
  let history = [];
  let busy = false;

  // Model output is untrusted: block raw HTML, render Markdown, and keep only http(s) links.
  const render = (md) => {
    const box = document.createElement('div');
    box.innerHTML = marked.parse(md.replace(/&/g, '&amp;').replace(/</g, '&lt;'));
    box.querySelectorAll('a').forEach((a) => {
      if (!/^https?:/i.test(a.getAttribute('href') || '')) a.removeAttribute('href');
      else { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
    });
    return box.innerHTML;
  };

  const add = (cls, html) => {
    $('empty')?.remove();
    const el = document.createElement('div');
    el.className = `msg ${cls}`;
    el.innerHTML = html;
    log.append(el);
    log.scrollTop = log.scrollHeight;
    return el;
  };
  const text = (s) => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };

  fetch('/api/models').then((r) => r.json()).then((list) => {
    for (const m of list) model.append(new Option(m.label, m.id));
  });

  async function ask(question) {
    if (busy || !question.trim()) return;
    busy = true; send.disabled = true;
    add('user', text(question));
    history.push({ role: 'user', content: question });
    const typing = add('bot typing', '<span></span><span></span><span></span>');
    try {
      const res = await fetch('/api/chat', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ model: model.value, messages: history }),
      });
      const data = await res.json();
      typing.remove();
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      const label = model.selectedOptions[0]?.text ?? '';
      const meta = `<span class="meta">${text(label)} · ${(data.ms / 1000).toFixed(1)} s</span>`;
      if (data.refused) {
        // Keep the conversation valid for the next turn, but don't show a blank bubble (finding F-001).
        history.push({ role: 'assistant', content: '(no reply)' });
        add('notice', `I can't help with that one, but I'm happy to help with your music: harmony, melody, form or lyrics.${meta}`);
      } else {
        history.push({ role: 'assistant', content: data.output });
        add('bot', render(data.output) + meta);
      }
    } catch (err) {
      typing.remove();
      history.pop(); // drop the unanswered question so the user can retry
      add('error', text(`Couldn't reach Coda: ${err.message}`));
    } finally {
      busy = false; send.disabled = false; input.focus();
    }
  }

  $('form').addEventListener('submit', (e) => { e.preventDefault(); const q = input.value; input.value = ''; grow(); ask(q); });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('form').requestSubmit(); } });
  const grow = () => { input.style.height = 'auto'; input.style.height = `${Math.min(input.scrollHeight, 180)}px`; };
  input.addEventListener('input', grow);
  document.querySelectorAll('.chips button').forEach((b) => b.addEventListener('click', () => ask(b.textContent)));
  $('reset').addEventListener('click', () => { history = []; location.reload(); });
  input.focus();
</script>
</body>
</html>
